[project]
name = "homeinventory"
version = "0.1.0"
description = "Supplies and small chores, coordinated between the people of one house."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The alembic/ migrations folder would otherwise make the library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as Depends(...) defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
